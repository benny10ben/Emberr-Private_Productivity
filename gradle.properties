# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Give the main Gradle Daemon 4GB of RAM, use the modern G1 Garbage Collector to prevent UI freezes, and allocate 1GB Metaspace
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Allocate 2GB specifically for the Kotlin Compiler Daemon
kotlin.daemon.jvm.options="-Xmx2G"

# Ensures the Kotlin compiler only recompiles modified files instead of the whole module
kotlin.incremental=true

# Speeds up builds by building decoupled modules (like Android and Desktop) simultaneously
org.gradle.parallel=true

# Caches compiled outputs to make subsequent builds much faster
org.gradle.caching=true

# Gradle only configures the specific modules needed for the task you are actively running
org.gradle.configureondemand=true

# Enforces official Kotlin code styling conventions
kotlin.code.style=official

# Enables AndroidX support
android.useAndroidX=true

# Disabled Jetifier to prevent slow, unnecessary binary rewriting of modern AndroidX dependencies
android.enableJetifier=false

# Allows Android Studio to fetch Gradle models in parallel during project sync
org.gradle.tooling.parallel=true
