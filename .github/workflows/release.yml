name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-draft-release:
    name: Build the AppImage and publish a draft release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(sed -n 's/^appVersion = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersion \"$app_version\" in gradle/libs.versions.toml"
            exit 1
          fi

      - name: Check that the update signing key is set up
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_PRIVATE_KEY repository secret is missing"
            exit 1
          fi
          key_file="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          public_key=$(openssl pkey -in "$key_file" -pubout -outform DER | base64 -w0)
          rm -f "$key_file"
          if ! grep -qF "\"$public_key\"" shared/src/desktopMain/kotlin/com/emberr/domain/update/UpdateManifestSignature.kt; then
            echo "::error::UPDATE_SIGNING_PUBLIC_KEY_BASE64 in UpdateManifestSignature.kt does not match the signing key. It should be $public_key"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install the pinned AppImage build tools
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/bin/appimagetool" | sha256sum --check
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./gradlew :shared:packageAppImage -PappImageRuntimeFile="$RUNNER_TEMP/runtime-x86_64" --stacktrace

      - name: Check that the database schema files are committed and unchanged
        run: |
          schema_changes=$(git status --porcelain -- shared/schemas)
          if [ -n "$schema_changes" ]; then
            echo "$schema_changes"
            echo "::error::The Room schema no longer matches the committed files. If you changed an entity, bump the version in AppDatabase.kt, add an AutoMigration, and commit the new schema file. Never edit an old one."
            exit 1
          fi

      - name: Write the update manifest
        run: |
          mkdir -p release-files
          cp shared/build/compose/binaries/main/appimage/Emberr-x86_64.AppImage release-files/
          app_image=release-files/Emberr-x86_64.AppImage
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Emberr-x86_64.AppImage" \
            --arg sha256 "$(sha256sum "$app_image" | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c %s "$app_image")" \
            '{version: $version, appImage: {url: $url, sha256: $sha256, sizeBytes: $sizeBytes}}' \
            > release-files/latest.json
          cat release-files/latest.json

      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in release-files/latest.json -out release-files/latest.json.sig
          openssl pkey -in "$key_file" -pubout -out "$RUNNER_TEMP/update-signing-public.pem"
          rm -f "$key_file"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-signing-public.pem" \
            -in release-files/latest.json -sigfile release-files/latest.json.sig

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Emberr ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release-files/Emberr-x86_64.AppImage \
            release-files/latest.json \
            release-files/latest.json.sig
