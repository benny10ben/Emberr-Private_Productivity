name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release-setup:
    name: Check the tag and the signing key
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(sed -n 's/^appVersion = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersion \"$app_version\" in gradle/libs.versions.toml"
            exit 1
          fi

      - name: Check that the update signing key is set up
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_PRIVATE_KEY repository secret is missing"
            exit 1
          fi
          key_file="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          public_key=$(openssl pkey -in "$key_file" -pubout -outform DER | base64 -w0)
          rm -f "$key_file"
          if ! grep -qF "\"$public_key\"" shared/src/desktopMain/kotlin/com/emberr/domain/update/UpdateManifestSignature.kt; then
            echo "::error::UPDATE_SIGNING_PUBLIC_KEY_BASE64 in UpdateManifestSignature.kt does not match the signing key. It should be $public_key"
            exit 1
          fi

  build-linux:
    name: Build the AppImage and the tarball
    needs: check-release-setup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install the pinned AppImage build tools
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/bin/appimagetool" | sha256sum --check
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the AppImage and the tarball
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./gradlew :shared:packageAppImage :shared:packageTarball -PappImageRuntimeFile="$RUNNER_TEMP/runtime-x86_64" --stacktrace

      - name: Check that the database schema files are committed and unchanged
        run: |
          schema_changes=$(git status --porcelain -- shared/schemas)
          if [ -n "$schema_changes" ]; then
            echo "$schema_changes"
            echo "::error::The Room schema no longer matches the committed files. If you changed an entity, bump the version in AppDatabase.kt, add an AutoMigration, and commit the new schema file. Never edit an old one."
            exit 1
          fi

      - name: Collect the Linux packages into one folder
        run: |
          mkdir -p linux-files
          cp shared/build/compose/binaries/main/appimage/Emberr-x86_64.AppImage linux-files/
          cp shared/build/compose/binaries/main/tarball/emberr-x86_64.tar.gz linux-files/

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: linux-files/
          retention-days: 3
          if-no-files-found: error

  build-windows:
    name: Build the Windows installer
    needs: check-release-setup
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build the installer with jpackage
        run: .\gradlew.bat :shared:packageExe --stacktrace

      - name: Give the installer a name that stays the same between versions
        run: |
          New-Item -ItemType Directory -Force -Path windows-files | Out-Null
          $installer = Get-ChildItem shared\build\compose\binaries\main\exe\*.exe | Select-Object -First 1
          Copy-Item $installer.FullName windows-files\Emberr-Setup-x86_64.exe

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: windows-files/Emberr-Setup-x86_64.exe
          retention-days: 3
          if-no-files-found: error

  publish-draft-release:
    name: Sign the update manifest and publish a draft release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the built packages
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Write the update manifest
        run: |
          download_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          app_image=release-files/Emberr-x86_64.AppImage
          tarball=release-files/emberr-x86_64.tar.gz
          windows_installer=release-files/Emberr-Setup-x86_64.exe
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg appImageUrl "$download_base/Emberr-x86_64.AppImage" \
            --arg appImageSha256 "$(sha256sum "$app_image" | cut -d' ' -f1)" \
            --argjson appImageSizeBytes "$(stat -c %s "$app_image")" \
            --arg tarballUrl "$download_base/emberr-x86_64.tar.gz" \
            --arg tarballSha256 "$(sha256sum "$tarball" | cut -d' ' -f1)" \
            --argjson tarballSizeBytes "$(stat -c %s "$tarball")" \
            --arg windowsInstallerUrl "$download_base/Emberr-Setup-x86_64.exe" \
            --arg windowsInstallerSha256 "$(sha256sum "$windows_installer" | cut -d' ' -f1)" \
            --argjson windowsInstallerSizeBytes "$(stat -c %s "$windows_installer")" \
            '{
              version: $version,
              appImage: {url: $appImageUrl, sha256: $appImageSha256, sizeBytes: $appImageSizeBytes},
              tarball: {url: $tarballUrl, sha256: $tarballSha256, sizeBytes: $tarballSizeBytes},
              windowsInstaller: {url: $windowsInstallerUrl, sha256: $windowsInstallerSha256, sizeBytes: $windowsInstallerSizeBytes}
            }' \
            > release-files/latest.json
          cat release-files/latest.json

      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in release-files/latest.json -out release-files/latest.json.sig
          openssl pkey -in "$key_file" -pubout -out "$RUNNER_TEMP/update-signing-public.pem"
          rm -f "$key_file"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-signing-public.pem" \
            -in release-files/latest.json -sigfile release-files/latest.json.sig

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Emberr ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release-files/Emberr-x86_64.AppImage \
            release-files/emberr-x86_64.tar.gz \
            release-files/Emberr-Setup-x86_64.exe \
            release-files/latest.json \
            release-files/latest.json.sig
