name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Run every test on both the desktop and Android targets
        run: ./gradlew :shared:allTests --stacktrace

      - name: Check that the database schema files are committed and unchanged
        run: |
          schema_changes=$(git status --porcelain -- shared/schemas)
          if [ -n "$schema_changes" ]; then
            echo "$schema_changes"
            echo "::error::The Room schema no longer matches the committed files. If you changed an entity, bump the version in AppDatabase.kt, add an AutoMigration, and commit the new schema file. Never edit an old one."
            exit 1
          fi

      - name: Compile the desktop target
        run: ./gradlew :shared:compileKotlinDesktop --stacktrace

      - name: Run Android Lint on the app and shared modules
        run: ./gradlew lint --stacktrace

      - name: Build the minified release APK to validate the R8 rules
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            shared/build/reports/lint-results*
            app/build/reports/lint-results*
          retention-days: 14
          if-no-files-found: warn
