name: Windows installer

on:
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-installer:
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build the installer with jpackage
        run: .\gradlew.bat :shared:packageExe --stacktrace

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: emberr-windows-installer
          path: shared/build/compose/binaries/main/exe/*.exe
          retention-days: 14
          if-no-files-found: error
